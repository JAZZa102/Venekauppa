<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vene1</title>

    <link rel="stylesheet" href="CSS/style.css">
 
</head>
<body>

    <main>
        <form action="#">

             <div class="lomake">
                    <label for="name">Nimi* </label>
                    <input type="text" id="name" name="name" required minlength="2" maxlength="80" placeholder="2-80 merkkiä">
                    </div>

                    <div class="lomake">
                    <label for="email">Sähköposti</label>
                    <input type="email" id="email" name="email" required maxlength="120">
                    </div>

                    <div class="lomake">
                    <label for="telephone">Puhelinnumero</label>
                    <input type="tel" pattern="\+?[0-9]{7,15}" id="telephone" name="telephone" placeholder="anna muotoa +3581231231">
                    </div>

                    <div class="lomake">
                    <label for="subject">Kiinnostava vene</label>
                    <select name="subject" id="subject" required>
                    

                    <option value=""></option>
                    <option value="vene1"><img src="images/iso-vene.jpg" alt=""></option>
                    <option value="Support">Support</option>
                    <option value="Feedback">Feedback</option>

                    </select>
                    </div>

                    
                    <div class="lomake">
                    <label for="message">Viesti</label>
                    <textarea name="message" id="message" minlength="10" maxlength="1000"></textarea>
                    

                      <button type="submit">Lähetä</button>









        </form>
    </main>
    
</body>
</html>
