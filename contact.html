<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vene1</title>

 
</head>
<body>

    <main>
        <form action="#">

             <div>
                    <label for="name">Name* </label>
                    <input type="text" id="name" name="name" required minlength="2" maxlength="80" placeholder="2-80 merkkiä">
                    </div>

                    <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required maxlength="120">
                    </div>

                    <div>
                    <label for="telephone">Telephone</label>
                    <input type="tel" pattern="\+?[0-9]{7,15}" id="telephone" name="telephone" placeholder="anna muotoa +3581231231">
                    </div>

                    <div>
                    <label for="subject">Subject: *</label>
                    <select name="subject" id="subject" required>
                    

                    <option value="">Select subject</option>
                    <option value="General Inquiry">General Inquiry</option>
                    <option value="Support">Support</option>
                    <option value="Feedback">Feedback</option>

                    </select>









        </form>
    </main>
    
</body>
</html>
