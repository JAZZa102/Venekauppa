<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vene1</title>

    <link rel="stylesheet" href="CSS/style.css">
 
</head>


<header>
    <div class="rajaus header-content">
            <a href="index.html" class="logo">VeneKauppa</a>
            <nav>
                <a href="index.html">Etusivu</a>
                <a href="boat1.html">Veneet</a>
                <a href="contact.html">Tiedustelu</a>
            </nav>
        </div>
</header>
<body>

    <main>
        <form action="https://httpbin.org/post" method="post">

             <div class="lomake">
                    <label for="name">Nimi* </label>
                    <input type="text" id="name" name="name" required minlength="2" maxlength="80" placeholder="2-80 merkkiä">
                    </div>

                    <div class="lomake">
                    <label for="email">Sähköposti*</label>
                    <input type="email" id="email" name="email" required maxlength="120">
                    </div>

                    <div class="lomake">
                    <label for="telephone">Puhelinnumero</label>
                    <input type="tel" pattern="\+?[0-9]{7,15}" id="telephone" name="telephone" placeholder="anna muotoa +3581231231">
                    </div>

                    <div class="lomake">
                    <label for="subject">Kiinnostava vene</label>
                    <select name="subject" id="subject" required>
                    

                    
                    <option value="Honda">Honda</option>
                    <option value="Marine">Marine</option>
                    <option value="LTAPSAH">LTAPSAH</option>

                    </select>
                    </div>

                    
                    <div class="lomake">
                    <label for="message">Viesti</label>
                    <textarea name="message" id="message" minlength="10" maxlength="1000"></textarea>
                    

                      <button type="submit">Lähetä</button>



        </form>

    </main>

      <footer>
        <div class="footer-content">
            <p>VeneKauppa</p>
            <p>|</p>
            <p>Puh: 123 456 7890</p>
        </div>
    </footer>
    

    <script>
document.addEventListener("DOMContentLoaded", function() {

    const params = new URLSearchParams(window.location.search);
    const vene = params.get("vene");

    if (vene) {
        const valikko = document.getElementById("subject");
        if (valikko) {
            valikko.value = vene;
        }
    }

});
</script>
</body>
</html>
